name: tr3000-build

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'files/**'
      - '.github/workflows/tr3000-build.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "check = only resolve .config; build = full build"
        required: true
        default: check
        type: choice
        options:
          - check
          - build

permissions:
  contents: write

env:
  SRC_REPO: https://github.com/fanchmwrt/fanchmwrt.git
  SRC_BRANCH: fanchmwrt-25.12.6
  # 清华 TUNA 源：镜像 releases/25.12.6 全量内容（targets、packages/*、kmods、luci…）
  MIRROR_REPO: https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/25.12.6

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif echo "${{ github.event.head_commit.message }}" | grep -q '\[full\]'; then
            MODE="build"
          else
            MODE="check"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "resolved mode: $MODE"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/az \
                      /usr/local/share/boost /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-setuptools rsync unzip \
            zlib1g-dev file wget qemu-utils subversion patch libelf-dev time

      - name: Clone FanchmWrt source
        run: git clone --depth 1 -b "$SRC_BRANCH" "$SRC_REPO" openwrt

      - name: Point package feeds at TUNA (Tsinghua) mirror
        run: |
          cd openwrt
          # include/version.mk 里的 VERSION_REPO 决定镜像内
          # /etc/apk/repositories.d/distfeeds.list 中 %U 的取值（feed 里叫 %U）。
          # 追加到文件末尾即覆盖默认的 https://downloads.openwrt.org/releases/25.12.6。
          printf '\n# --- TUNA (Tsinghua) mirror, injected by tr3000-build ---\nVERSION_REPO:=%s\n' "$MIRROR_REPO" >> include/version.mk
          tail -3 include/version.mk
          echo "--- mirror sanity check ---"
          curl -fsIL "$MIRROR_REPO/targets/mediatek/filogic/packages/packages.adb" > /dev/null \
            && echo "mirror OK: $MIRROR_REPO" \
            || { echo "mirror MISSING: $MIRROR_REPO (需要同步更新 MIRROR_REPO 版本号)"; exit 1; }

      - name: Add extra feeds
        run: |
          cd openwrt
          cat >> feeds.conf.default <<'EOF'
src-git openclash https://github.com/vernesong/OpenClash.git;master
src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
src-git istore https://github.com/linkease/istore.git;main
EOF
          tail -8 feeds.conf.default

      - name: Feeds update and install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          cp -fr feeds_patches/* feeds/
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store || true
          echo "== openclash =="; ls -d package/feeds/openclash/* 2>/dev/null || true
          echo "== passwall2 =="; ls -d package/feeds/passwall2/* 2>/dev/null || true
          echo "== passwall_packages =="; ls package/feeds/passwall_packages 2>/dev/null | head -30 || true
          echo "== istore =="; ls -d package/feeds/istore/* 2>/dev/null || true

      - name: Resolve .config
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/config/diffconfig" .config
          while read -r p; do
            [ -z "$p" ] && continue
            echo "CONFIG_PACKAGE_$p=y" >> .config
          done < "$GITHUB_WORKSPACE/config/packages.txt"
          make defconfig
          cp .config /tmp/resolved.config
          echo "===== requested packages that did NOT survive defconfig ====="
          while read -r p; do
            [ -z "$p" ] && continue
            grep -q "^CONFIG_PACKAGE_$p=y" .config || echo "MISSING: $p"
          done < "$GITHUB_WORKSPACE/config/packages.txt"
          echo "===== key selections ====="
          grep -E '^CONFIG_(TARGET_PROFILE|PACKAGE_luci-app-(openclash|passwall2|store|ksmbd)|PACKAGE_xray-core|PACKAGE_wwan|PACKAGE_kmod-usb-net-rndis)' .config || true

      - name: Upload resolved config
        if: steps.mode.outputs.mode == 'check'
        uses: actions/upload-artifact@v4
        with:
          name: resolved-config
          path: /tmp/resolved.config

      - name: Stage custom overlay files
        if: steps.mode.outputs.mode == 'build'
        run: cp -r "$GITHUB_WORKSPACE/files" openwrt/files

      - name: Cache downloads
        if: steps.mode.outputs.mode == 'build'
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ github.run_id }}
          restore-keys: |
            dl-

      - name: Download package sources
        if: steps.mode.outputs.mode == 'build'
        run: |
          cd openwrt
          make -j"$(nproc)" download || make -j1 download

      - name: Build
        if: steps.mode.outputs.mode == 'build'
        run: |
          cd openwrt
          make -j"$(nproc)" || {
            echo "=== BUILD FAILED, tail of recent package logs ==="
            ls -t logs/package/*/*/*.txt 2>/dev/null | head -6 | while read f; do echo "--- $f"; tail -40 "$f"; done
            exit 1
          }

      - name: Collect images
        if: steps.mode.outputs.mode == 'build'
        run: |
          mkdir -p out
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.manifest' -o -name 'sha256sums' \) \
            -exec cp {} out/ \;
          cp /tmp/resolved.config out/resolved-config.txt
          ls -lh out

      - name: Upload firmware artifact
        if: steps.mode.outputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-tr3000
          path: out/*

      - name: Create release
        if: steps.mode.outputs.mode == 'build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FanchmWrt TR3000 build-${{ github.run_number }}
          body: |
            Cudy TR3000 256MB v1 / FanchmWrt ${{ env.SRC_BRANCH }}
            USB tethering + network + storage, OpenClash, PassWall2, iStore
          files: |
            out/*.bin
            out/*.manifest
            out/sha256sums
          fail_on_unmatched_files: false

name: Build TR3000 256MB full (USB + OpenClash + PassWall2 + iStore + OpenList)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget time

      - name: Clone FanchmWrt source
        run: |
          git clone --depth 1 -b fanchmwrt-25.12.6 \
            https://github.com/fanchmwrt/fanchmwrt.git openwrt

      - name: Add third-party feeds
        working-directory: openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git openclash https://github.com/vernesong/OpenClash.git;master
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          src-git openlist https://github.com/sbwml/luci-app-openlist2.git;main
          EOF
          grep -q 'src-git istore ' feeds.conf.default || echo 'src-git istore https://github.com/linkease/istore.git;main' >> feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select device, USB drivers and apps
        working-directory: openwrt
        run: |
          cat > .config <<'CFG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_kmod-nls-utf8=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_luci-proto-ncm=y
          CONFIG_PACKAGE_luci-proto-3g=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_xz-utils=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-openlist2=y
          CONFIG_PACKAGE_openlist2=y
          CFG
          make defconfig
          grep -q 'CONFIG_TARGET_PROFILE="DEVICE_cudy_tr3000-256mb-v1"' .config || { echo "FAIL: wrong target profile"; exit 1; }
          grep -q 'CONFIG_PACKAGE_kmod-usb-net-rndis=y' .config || { echo "FAIL: usb net not selected"; exit 1; }
          grep -q 'CONFIG_PACKAGE_luci-app-openclash=y' .config || { echo "FAIL: openclash not selected"; exit 1; }
          grep -q 'CONFIG_PACKAGE_luci-app-passwall2=y' .config || { echo "FAIL: passwall2 not selected"; exit 1; }
          grep -q 'CONFIG_PACKAGE_luci-app-store=y' .config || { echo "FAIL: istore not selected"; exit 1; }
          grep -q 'CONFIG_PACKAGE_luci-app-openlist2=y' .config || { echo "FAIL: openlist not selected"; exit 1; }
          grep -q 'CONFIG_PACKAGE_openlist2=y' .config || { echo "FAIL: openlist binary not selected"; exit 1; }
          echo "=== all apps selected ==="
          grep -E '^CONFIG_PACKAGE_(luci-app-store|luci-app-openclash|luci-app-passwall2|luci-app-openlist2|openlist2)=y' .config

      - name: Download package sources
        working-directory: openwrt
        run: make -j"$(nproc)" download

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || {
            echo "=== BUILD FAILED, last package logs ==="
            ls -t logs/package/*/*/*.txt 2>/dev/null | head -5 | while read f; do echo "--- $f"; tail -40 "$f"; done
            exit 1
          }

      - name: Show image size
        working-directory: openwrt
        run: ls -lh bin/targets/mediatek/filogic/ | grep -i tr3000

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-usb-full
          path: openwrt/bin/targets/mediatek/filogic/*cudy_tr3000-256mb-v1*
          if-no-files-found: error
